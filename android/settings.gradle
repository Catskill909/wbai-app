pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.12.2" apply false
    // The app module no longer applies kotlin-android (it uses AGP built-in
    // Kotlin), but KGP must stay resolvable here: Flutter plugin modules such
    // as share_plus and purchases_flutter still apply kotlin-android in their
    // own build.gradle. Removing this breaks the build at configuration time.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

rootProject.name = "kpfk_radio"

include ":app"
